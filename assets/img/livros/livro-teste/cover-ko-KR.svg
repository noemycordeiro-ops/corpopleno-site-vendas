<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="t d">
  <title id="t">코르포플레누 테스트 도서 표지</title>
  <desc id="d">분홍색에서 보라색으로 이어지는 그라데이션 배경의 예시 표지, 테스트 도서 제목 포함.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#g)"/>
  <circle cx="320" cy="90" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="60" cy="520" r="90" fill="#ffffff" opacity="0.10"/>
  <text x="40" y="270" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="30" font-weight="700" fill="#ffffff">코르포플레누</text>
  <text x="40" y="320" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="30" font-weight="700" fill="#ffffff">테스트 도서</text>
  <text x="40" y="400" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="15" fill="#ffffff" opacity="0.9">내부 검증 자료</text>
  <text x="40" y="560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">CorpoPleno</text>
</svg>
