<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="t d">
  <title id="t">Capa do Livro de Teste CorpoPleno (PT-PT)</title>
  <desc id="d">Capa ilustrativa, fundo em gradiente rosa e roxo, com o título do livro de teste.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#g)"/>
  <circle cx="320" cy="90" r="70" fill="#ffffff" opacity="0.12"/>
  <circle cx="60" cy="520" r="90" fill="#ffffff" opacity="0.10"/>
  <text x="40" y="260" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Livro de</text>
  <text x="40" y="304" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Teste</text>
  <text x="40" y="348" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">CorpoPleno</text>
  <text x="40" y="400" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">Material interno de validação</text>
  <text x="40" y="560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.8">CorpoPleno</text>
</svg>
