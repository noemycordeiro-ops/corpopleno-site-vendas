name = "cp-web-001"
type = "javascript"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Functions
[env.production]
routes = [
  { pattern = "www.corpoplenoresultadoreal.com.br", zone_name = "corpoplenoresultadoreal.com.br" }
]

# Cache da build (Beta)
[env.production.cache_on_cookie]
session = "corpopleno_session"

# Variáveis secretas (não logadas) - configurar via Cloudflare Dashboard
[env.production.vars]
ASAAS_ENVIRONMENT = "production"
ASAAS_API_URL = "https://api.asaas.com/api/v3"
# ASAAS_API_KEY deve ser configurado via Dashboard Secrets

# Implantação automática via GitHub
[triggers]
crons = ["0 2 * * *"]
